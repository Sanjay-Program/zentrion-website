name = "zentrion-website"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "./out"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "zentrion-db"
database_id = "INSERT_DATABASE_ID_HERE"

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "INSERT_KV_NAMESPACE_ID_HERE"

# R2 Bucket
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zentrion-files"

# Workers AI
[ai]
binding = "AI"

[vars]
ADMIN_KEY = "your-super-secret-admin-key"
SITE_URL = "https://zentriontechnologies.com"
